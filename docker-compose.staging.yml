## Add your compose file here
version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: mws-backend-staging


    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped
    ports:
      - "10000:10000"

    command: >
      sh -c "
      php artisan serve --host=0.0.0.0 --port=10000
      "


    env_file:
      - .env.staging

    volumes:
      - storage:/var/www/storage

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.0
    container_name: mws-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: mws
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  storage:
  mysql_data:
